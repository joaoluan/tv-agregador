# Staging público isolado, somente fontes públicas, para validar o free tier.
services:
  - type: web
    name: tv-agregador-staging
    runtime: node
    plan: free
    region: virginia
    branch: chore/fase-4-validacao
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: IPTV_ORG
        value: "off"

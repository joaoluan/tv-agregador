services:
  - type: web
    name: tv-agregador
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22
      # Addons com login pessoal (ex.: FrostStream). Formato: Nome|https://link-pessoal/manifest.json
      - key: ADDONS_PRIVADOS
        sync: false
      # Listas M3U próprias (opcional). Formato: Nome|https://link.m3u ; Outro|https://outro.m3u
      - key: M3U_LISTS
        sync: false
      # Use "on" explicitamente para habilitar iptv-org (maior uso de memória).
      - key: IPTV_ORG
        value: "off"
